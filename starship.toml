# Starship prompt: Pure-style layout, default Starship colors
"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$jobs\
$line_break\
$character"""

[directory]
style = "cyan"

[git_branch]
format = "[|](bright-black) [$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](red) ($ahead_behind$stashed)]($style)"
style = "bright-black"
# The six values below are U+200B zero-width spaces, not empty strings: any
# dirty state renders the lone * above. Empty strings would disable the (...)
# group entirely. Do not let an editor strip them.
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"

[git_state]
format = ' [|](bright-black) \([$state( $progress_current/$progress_total)]($style)\)'
style = "yellow"

# The explicit format above already omits these modules; disabled = true is
# deliberate belt-and-suspenders so a format edit (e.g. adding $all) cannot
# re-enable their detection cost. Do not remove as dead config.
[cmd_duration]
disabled = true

[jobs]
format = " [|](bright-black) [$symbol$number]($style)"
style = "cyan"

[gcloud]
disabled = true

[nodejs]
disabled = true

[package]
disabled = true

[python]
disabled = true
