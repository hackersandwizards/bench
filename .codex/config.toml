model = "gpt-6-luna"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
project_doc_fallback_filenames = ["CLAUDE.md"]
tui.status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-remaining", "five-hour-limit"]

[mcp_servers.chrome-devtools]
command = "bun"
args = ["-i", "-e", "import{detectBrowserPlatform as d,getInstalledBrowsers as g,install as i,resolveBuildId as r}from'@puppeteer/browsers';import{spawn}from'node:child_process';import{homedir}from'node:os';import{join}from'node:path';const c=process.env.PUPPETEER_CACHE_DIR??join(homedir(),'.cache','puppeteer'),p=d(),b=(await g({cacheDir:c})).filter(function(x){return x.browser=='chrome'}).filter(function(x){return x.platform==p}).sort(function(x,y){return x.buildId.localeCompare(y.buildId,'en',{numeric:true})}).at(-1)??await i({browser:'chrome',buildId:await r('chrome',p,'stable'),cacheDir:c}),m=spawn(process.execPath,['x',...process.argv.slice(1),'--executablePath',b.executablePath],{stdio:'inherit'});for(const s of['SIGINT','SIGTERM'])process.on(s,function(){m.kill(s)});m.on('exit',function(n){process.exit(n??1)})", "chrome-devtools-mcp@latest", "--headless", "--isolated", "--viewport=1920x1080", "--no-performance-crux", "--no-usage-statistics"]

[features]
js_repl = false
apps = false

[tui.model_availability_nux]
"gpt-5.5" = 4

[notice]
hide_rate_limit_model_nudge = true

[desktop]
keepRemoteControlAwakeWhilePluggedIn = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
DISABLE_ERROR_REPORTING = "1"

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."github@openai-curated"]
enabled = false

[plugins."github@openai-curated-remote"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false
