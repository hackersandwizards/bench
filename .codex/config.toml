model = "gpt-6-astra"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "high"
project_doc_fallback_filenames = ["CLAUDE.md"]
tui.status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-remaining", "five-hour-limit"]

[mcp_servers.chrome-devtools]
command = "bunx"
args = ["chrome-devtools-mcp@latest", "--headless", "--isolated", "--viewport=1920x1080", "--no-performance-crux", "--no-usage-statistics"]

[features]
js_repl = false
apps = false

[tui.model_availability_nux]
"gpt-5.5" = 4

[notice]
hide_rate_limit_model_nudge = true

[desktop]
keepRemoteControlAwakeWhilePluggedIn = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
DISABLE_ERROR_REPORTING = "1"

[plugins."computer-use@openai-bundled"]
enabled = false

[plugins."chrome@openai-bundled"]
enabled = false

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."github@openai-curated"]
enabled = false

[plugins."github@openai-curated-remote"]
enabled = false

[plugins."browser@openai-bundled"]
enabled = false
