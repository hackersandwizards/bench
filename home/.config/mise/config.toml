[tools]
ruby = "4"
java = ["temurin-26", "temurin-25", "temurin-21", "temurin-17", "temurin-11"]
gradle = "latest"
maven = "latest"
quarkus = "latest"
go = "latest"
deno = "latest"
bun = "latest"
uv = "latest"
erlang = "latest"
elixir = "latest"
"pypi:claude-swap" = { version = "latest", with = ["rumps"] }
"pypi:git+https://github.com/youssofal/MTPLX" = { version = "latest", with = ["llguidance"] }
"pypi:scrapling" = { version = "latest", extras = "shell" }
"pypi:yt-dlp" = "latest"

[settings]
idiomatic_version_file_enable_tools = ["ruby", "node", "java"]
# mise defaults to holding back releases younger than 24h. Always take the latest.
minimum_release_age = "0"

# Unauthenticated GitHub API calls hit the rate limit.
[settings.github]
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
